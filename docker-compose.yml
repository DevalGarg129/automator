services:
  backend:
    build:
      context: ./backend
    container_name: cloud-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
    expose:
      - "5000"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    container_name: cloud-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: cloud-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge